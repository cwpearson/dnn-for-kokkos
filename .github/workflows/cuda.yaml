name: CUDA build

# GPU build-only CI: Kokkos CUDA backend, compile everything but run
# nothing (GitHub-hosted runners have no GPU). Two legs via matrix:
#  - tpl=OFF in the plain devel image: pure build check with no extra
#    toolkit version coupling.
#  - tpl=ON in the cudnn-devel image: exercises the cuBLAS GEMM and cuDNN
#    SDPA dispatch paths (KokkosDNN_ENABLE_CUBLAS/CUDNN).
# Mirrors the Serial CI (.github/workflows/serial.yaml) in structure,
# minus the test execution.
on:
  push:
    paths-ignore:
      - "docs/**"
      - ".github/workflows/docs.yaml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".github/workflows/docs.yaml"

jobs:
  cuda:
    runs-on: ubuntu-latest
    name: cuda (tpl=${{ matrix.tpl }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Plain devel image provides nvcc + CUDAToolkit; keeps the
          # TPL-disabled leg free of cuBLAS/cuDNN version coupling.
          # (Quotes are load-bearing: unquoted ON/OFF parse as YAML
          # booleans, which would break the matrix.tpl comparison below.)
          - tpl: 'OFF'
            image: nvidia/cuda:12.8.1-devel-ubuntu24.04
          # cudnn-devel image adds cuDNN on top of the devel image; needed
          # for the TPL-enabled leg (cuBLAS ships in both images).
          - tpl: 'ON'
            image: nvidia/cuda:12.8.1-cudnn-devel-ubuntu24.04
    # Build-only (no GPU at runtime) so no --gpus flag is needed.
    container:
      image: ${{ matrix.image }}
    env:
      KOKKOS_VERSION: 5.2.1
      # NOTE: do NOT derive paths from ${{ github.workspace }} here.
      # Inside a `container:` job that context holds the *host* path
      # (/home/runner/work/...), which does not exist inside the container
      # (see actions/runner#2058). Use $GITHUB_WORKSPACE at run time instead,
      # which holds the container-side mount (/github/workspace).
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          # libstb-dev provides the system stb headers (/usr/include/stb/)
          # preferred by the optional image component (find-or-fetch).
          apt-get install -y cmake g++ git libstb-dev

      # Shallow checkout of the Kokkos release tag into kokkos-src.
      # submodules: recursive is required: the build needs desul/mdspan,
      # which git does not fetch by default.
      - name: Check out Kokkos
        uses: actions/checkout@v4
        with:
          repository: kokkos/kokkos
          ref: ${{ env.KOKKOS_VERSION }}
          path: kokkos-src
          submodules: recursive

      - name: Build and install Kokkos (CUDA + Serial)
        run: |
          # Ampere (SM80) is a sensible compile-only default: no GPU is
          # present, so nothing queries the real device; any supported
          # Kokkos_ARCH_* (or Kokkos_ARCH_NATIVE=ON on a GPU node) works.
          # $GITHUB_WORKSPACE is the container-side workspace path; the
          # ${{ github.workspace }} context would expand to the host path and
          # does not exist inside the container.
          KOKKOS_INSTALL="$GITHUB_WORKSPACE/kokkos-install"
          NVCC_WRAPPER="$GITHUB_WORKSPACE/kokkos-src/bin/nvcc_wrapper"
          # Fail fast with a clear log if the checkout did not land.
          test -x "$NVCC_WRAPPER" || { echo "nvcc_wrapper not found at $NVCC_WRAPPER"; ls "$GITHUB_WORKSPACE/kokkos-src/bin" || true; exit 1; }
          cmake -S kokkos-src -B kokkos-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${KOKKOS_INSTALL}" \
            -DCMAKE_CXX_COMPILER="${NVCC_WRAPPER}" \
            -DKokkos_ENABLE_CUDA=ON \
            -DKokkos_ENABLE_SERIAL=ON \
            -DKokkos_ARCH_AMPERE80=ON \
            -DKokkos_ENABLE_TESTS=OFF
          cmake --build kokkos-build --parallel "$(nproc)"
          cmake --install kokkos-build

      - name: Configure KokkosDNN
        run: |
          # Build-only: TESTS=ON + EXAMPLES=ON + BENCHMARKS=ON maximize
          # compile coverage. The whole project must compile with
          # nvcc_wrapper against a CUDA Kokkos (device code in headers).
          # tpl=ON enables the cuBLAS GEMM and cuDNN SDPA dispatch paths;
          # tpl=OFF keeps a pure build check with no extra toolkit version
          # coupling.
          # TEST_DISCOVERY=OFF: gtest_discover_tests executes test binaries
          # at build time, but the runner has no GPU (libcuda.so.1 is
          # absent), so every test binary fails to start. This workflow is
          # compile coverage only.
          KOKKOS_INSTALL="$GITHUB_WORKSPACE/kokkos-install"
          NVCC_WRAPPER="$GITHUB_WORKSPACE/kokkos-src/bin/nvcc_wrapper"
          if [ "${{ matrix.tpl }}" = "ON" ]; then
            TPL_FLAGS="-DKokkosDNN_ENABLE_CUBLAS=ON -DKokkosDNN_ENABLE_CUDNN=ON"
          else
            TPL_FLAGS="-DKokkosDNN_ENABLE_CUBLAS=OFF -DKokkosDNN_ENABLE_CUDNN=OFF"
          fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="${NVCC_WRAPPER}" \
            -DKokkos_ROOT="${KOKKOS_INSTALL}" \
            -DKokkosDNN_ENABLE_TESTS=ON \
            -DKokkosDNN_ENABLE_TEST_DISCOVERY=OFF \
            -DKokkosDNN_ENABLE_EXAMPLES=ON \
            -DKokkosDNN_ENABLE_BENCHMARKS=ON \
            ${TPL_FLAGS}

      # Build every target (library, tests, examples). Deliberately does
      # NOT run ctest or any example binary: there is no GPU on the runner,
      # so execution would fail; this workflow is compile coverage only.
      - name: Build everything
        run: cmake --build build --parallel "$(nproc)"
