name: ROCm build

# GPU build-only CI: Kokkos HIP backend, compile everything but run
# nothing (GitHub-hosted runners have no GPU). Two legs via matrix:
#  - tpl=OFF: pure build check with no extra toolkit version coupling.
#  - tpl=ON: exercises the hipBLAS GEMM and MIOpen conv dispatch paths
#    (KokkosDNN_ENABLE_HIPBLAS/MIOPEN).
# Mirrors the CUDA CI (.github/workflows/cuda.yaml) in structure,
# minus the container (ROCm is installed via AMD's apt repositories).
on:
  push:
    paths-ignore:
      - "docs/**"
      - ".github/workflows/docs.yaml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".github/workflows/docs.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rocm:
    # Pinned to 24.04 (noble) to match the AMD package repositories below.
    runs-on: ubuntu-24.04
    name: rocm (tpl=${{ matrix.tpl }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # TPL-disabled leg keeps a pure build check with no extra toolkit
          # version coupling.
          # (Quotes are load-bearing: unquoted ON/OFF parse as YAML
          # booleans, which would break the matrix.tpl comparison below.)
          - tpl: 'OFF'
          # TPL-enabled leg exercises the hipBLAS GEMM and MIOpen conv
          # dispatch paths (KokkosDNN_ENABLE_HIPBLAS/MIOPEN).
          - tpl: 'ON'
    # /opt/rocm is the default install prefix; Kokkos's find_package(hip)
    # honors ROCM_PATH, and kokkos_arch uses $ROCM_PATH for --rocm-path.
    env:
      KOKKOS_VERSION: 5.2.1
      KOKKOS_INSTALL: ${{ github.workspace }}/kokkos-install
      ROCM_PATH: /opt/rocm
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          # libstb-dev provides the system stb headers (/usr/include/stb/)
          # preferred by the optional image component (find-or-fetch).
          sudo apt-get install -y cmake g++ git curl gpg libstb-dev

      # Install the ROCm HIP SDK (hipcc, headers, CMake config, LLVM, device
      # libs) from AMD's apt repositories. rocm-hip-sdk is the documented
      # meta-package for developing/porting HIP applications; install
      # location is /opt/rocm. Pinned to 6.4.1 (same as AMD's own dev image
      # recipe in ROCm/ROCm-docker).
      - name: Install ROCm HIP SDK
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.radeon.com/rocm/rocm.gpg.key \
            | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/amdgpu/6.4.1/ubuntu noble main" \
            | sudo tee /etc/apt/sources.list.d/amdgpu.list
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/6.4.1 noble main" \
            | sudo tee /etc/apt/sources.list.d/rocm.list
          echo -e 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 600' \
            | sudo tee /etc/apt/preferences.d/rocm-pin-600
          sudo apt-get update
          # rocm-hip-sdk alone does not ship rocThrust/rocPRIM/hipCUB, but
          # Kokkos's HIP backend enables its ROCTHRUST TPL by default
          # (Kokkos_ENABLE_ROCTHRUST=ON since Kokkos 4.3), whose
          # rocthrust-config.cmake does find_dependency(rocprim). Install the
          # dev packages so Kokkos configure can find them under /opt/rocm.
          sudo apt-get install -y rocm-hip-sdk rocprim-dev rocthrust-dev hipcub-dev
          # TPL leg: hipBLAS (GEMM dispatch) and MIOpen (conv dispatch).
          # Installed only when needed so the TPL-disabled leg stays free
          # of extra toolkit version coupling.
          if [ "${{ matrix.tpl }}" = "ON" ]; then
            sudo apt-get install -y hipblas-dev miopen-hip-dev
          fi
          # Fail fast with a clear log if the install did not land.
          /opt/rocm/bin/hipcc --version
          ls /opt/rocm/lib/cmake/hip/
          ls /opt/rocm/lib/cmake/rocthrust/ /opt/rocm/lib/cmake/rocprim/ /opt/rocm/lib/cmake/hipcub/
          if [ "${{ matrix.tpl }}" = "ON" ]; then
            ls /opt/rocm/lib/cmake/hipblas/
            ls /opt/rocm/lib/cmake/ | grep -i miopen
          fi

      # Shallow checkout of the Kokkos release tag into kokkos-src.
      # submodules: recursive is required: the build needs desul/mdspan,
      # which git does not fetch by default.
      - name: Check out Kokkos
        uses: actions/checkout@v4
        with:
          repository: kokkos/kokkos
          ref: ${{ env.KOKKOS_VERSION }}
          path: kokkos-src
          submodules: recursive

      - name: Build and install Kokkos (HIP + Serial)
        run: |
          # gfx90a (MI200, Kokkos_ARCH_AMD_GFX90A) is a sensible
          # compile-only default: no GPU is present, so nothing queries
          # the real device; any supported Kokkos_ARCH_* (or
          # Kokkos_ARCH_NATIVE=ON on a GPU node) works. (VEGA90A was the
          # pre-4.x name and is silently ignored by Kokkos 5.)
          # ROCM_PATH points find_package(hip) at /opt/rocm.
          # CMAKE_PREFIX_PATH is also required: FindTPLROCTHRUST locates
          # rocthrust via ROCM_PATH, but rocthrust-config.cmake itself does
          # find_dependency(rocprim) with no PATHS hint, so without /opt/rocm
          # on the prefix path CMake fails with "Could not find a package
          # configuration file provided by rocprim".
          cmake -S kokkos-src -B kokkos-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${KOKKOS_INSTALL}" \
            -DCMAKE_PREFIX_PATH="${ROCM_PATH}" \
            -DCMAKE_CXX_COMPILER="${ROCM_PATH}/bin/hipcc" \
            -DROCM_PATH="${ROCM_PATH}" \
            -DKokkos_ENABLE_HIP=ON \
            -DKokkos_ENABLE_SERIAL=ON \
            -DKokkos_ARCH_AMD_GFX90A=ON \
            -DKokkos_ENABLE_TESTS=OFF
          cmake --build kokkos-build --parallel "$(nproc)"
          cmake --install kokkos-build

      - name: Configure KokkosDNN
        run: |
          # Build-only: TESTS=ON + EXAMPLES=ON + BENCHMARKS=ON maximize
          # compile coverage. The whole project must compile
          # with hipcc against a HIP Kokkos (device code in headers).
          # tpl=ON enables the hipBLAS GEMM and MIOpen conv dispatch paths;
          # tpl=OFF keeps a pure build check with no extra toolkit version
          # coupling.
          # CMAKE_PREFIX_PATH keeps downstream find_package(Kokkos) ->
          # find_dependency(hip/rocthrust) resolving under /opt/rocm.
          # TEST_DISCOVERY=OFF: gtest_discover_tests executes test binaries
          # at build time, but the runner has no GPU, so every test binary
          # aborts inside Kokkos::initialize. This workflow is compile
          # coverage only.
          if [ "${{ matrix.tpl }}" = "ON" ]; then
            TPL_FLAGS="-DKokkosDNN_ENABLE_HIPBLAS=ON -DKokkosDNN_ENABLE_MIOPEN=ON"
          else
            TPL_FLAGS="-DKokkosDNN_ENABLE_HIPBLAS=OFF -DKokkosDNN_ENABLE_MIOPEN=OFF"
          fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${ROCM_PATH}" \
            -DCMAKE_CXX_COMPILER="${ROCM_PATH}/bin/hipcc" \
            -DKokkos_ROOT="${KOKKOS_INSTALL}" \
            -DKokkosDNN_ENABLE_TESTS=ON \
            -DKokkosDNN_ENABLE_TEST_DISCOVERY=OFF \
            -DKokkosDNN_ENABLE_EXAMPLES=ON \
            -DKokkosDNN_ENABLE_BENCHMARKS=ON \
            -DKokkosDNN_ENABLE_COMPILER_WARNINGS=ON \
            ${TPL_FLAGS}

      # Build every target (library, tests, examples). Deliberately does
      # NOT run ctest or any example binary: there is no GPU on the runner,
      # so execution would fail; this workflow is compile coverage only.
      - name: Build everything
        run: cmake --build build --parallel "$(nproc)"
