name: Serial build

# CPU-only CI: Kokkos Serial backend, build everything, but execute only
# the tests and examples that finish in reasonable time on a single core.
on:
  push:
    paths-ignore:
      - "docs/**"
      - ".github/workflows/docs.yaml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".github/workflows/docs.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  serial:
    runs-on: ubuntu-latest
    env:
      KOKKOS_VERSION: 5.2.1
      KOKKOS_INSTALL: ${{ github.workspace }}/kokkos-install
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update
          # libstb-dev provides the system stb headers (/usr/include/stb/)
          # preferred by the optional image component (find-or-fetch).
          sudo apt-get install -y cmake g++ git libstb-dev

      # Shallow checkout of the Kokkos release tag into kokkos-src.
      # submodules: recursive is required: the build needs desul/mdspan,
      # which git does not fetch by default.
      - name: Check out Kokkos
        uses: actions/checkout@v5
        with:
          repository: kokkos/kokkos
          ref: ${{ env.KOKKOS_VERSION }}
          path: kokkos-src
          submodules: recursive

      - name: Build and install Kokkos (Serial only)
        run: |
          cmake -S kokkos-src -B kokkos-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${KOKKOS_INSTALL}" \
            -DKokkos_ENABLE_SERIAL=ON \
            -DKokkos_ENABLE_TESTS=OFF
          cmake --build kokkos-build --parallel "$(nproc)"
          cmake --install kokkos-build

      - name: Configure KokkosDNN
        run: |
          # KokkosDNN_ENABLE_IMAGE=ON builds src/images (KokkosDNN::Image,
          # stb-backed I/O) and registers its unit tests (Test_Image).
          # KokkosDNN_ENABLE_SERVER=ON builds server/kokkosdnn_server plus
          # its parsing unit test (kokkosdnn_server_parsing, no weights
          # needed); FetchContent fetches cpp-httplib + nlohmann/json.
          # -Werror is bundled into the option, so CI builds are
          # warnings-clean under the Kokkos warning set.
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DKokkos_ROOT="${KOKKOS_INSTALL}" \
            -DKokkosDNN_ENABLE_TESTS=ON \
            -DKokkosDNN_ENABLE_EXAMPLES=ON \
            -DKokkosDNN_ENABLE_BENCHMARKS=ON \
            -DKokkosDNN_ENABLE_IMAGE=ON \
            -DKokkosDNN_ENABLE_SERVER=ON \
            -DKokkosDNN_ENABLE_COMPILER_WARNINGS=ON

      # Build every target (library, tests, examples, benchmarks).
      - name: Build everything
        run: cmake --build build --parallel "$(nproc)"

      # Run the full ctest suite: unit tests plus example tests, all on tiny
      # configs that run in seconds on Serial. Tests needing real data
      # (KOKKOSDNN_WEIGHTS / TOKENIZER_JSON / GOLDEN_JSON / LLAMA_CONFIG_JSON)
      # self-skip via GTEST_SKIP when those files are absent. The
      # kokkosdnn_bench_list entry only lists benchmarks (no kernels run).
      # Deliberately NOT executed here: kokkosdnn_bench microbenchmarks run
      # Llama 8B shapes whose naive native kernels take seconds per
      # iteration on Serial (see README "Benchmarks"), so they are
      # GPU-oriented and unsuitable for a single-core runner.
      - name: Run tests
        run: ctest --test-dir build --output-on-failure --timeout 300

      # Example smoke runs, limited to configs suitable for a single core:
      # --tiny uses a 2-layer dim=64 random model (milliseconds); xor_train
      # is a 2-layer MLP on 4 samples (milliseconds). Deliberately NOT run:
      # full-shape random models (--model 3.2-1b takes ~40 s for 8 tokens on
      # Serial, default 8B shapes take many minutes) and real checkpoints
      # (~16 GiB downloads, large RAM/GPU needs).
      - name: Run single-core example smoke tests
        run: |
          ./build/examples/llama/llama_generate --tiny --prompt "Hello" --max-new 8
          ./build/examples/xor/xor_train

      # Install + consume: verifies the installed package config, export
      # names, and headers by configuring, building, and running the
      # standalone consumer in tests/consume against the install tree
      # (core, common, lfm25, moss, qwen_image_21, image). TPL branches of
      # the package config (CUDNN/CUBLAS, hipBLAS/MIOpen) are not enabled
      # in this workflow; those are covered by the CUDA/ROCm install
      # consumers.
      - name: Install KokkosDNN
        run: cmake --install build --prefix "${{ github.workspace }}/kdnn-install"

      - name: Build and run install consumer (all components)
        run: |
          cmake -S tests/consume -B /tmp/kdnn-consume-build \
            -DKokkos_ROOT="${KOKKOS_INSTALL}" \
            -DKokkosDNN_ROOT="${{ github.workspace }}/kdnn-install"
          cmake --build /tmp/kdnn-consume-build --parallel "$(nproc)"
          /tmp/kdnn-consume-build/consumer
